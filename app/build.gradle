plugins { id 'com.android.application' }

android {
    namespace 'com.ruih.framedeck'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ruih.framedeck'
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName '1.4.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // Optional local key; signing material is intentionally excluded from Git.
    if (rootProject.file('signing/framedeck-demo.keystore').exists()) {
        signingConfigs {
            debug {
                storeFile rootProject.file('signing/framedeck-demo.keystore')
                storePassword 'android'
                keyAlias 'AndroidDebugKey'
                keyPassword 'android'
            }
        }
    }
    lint { abortOnError true }
}
